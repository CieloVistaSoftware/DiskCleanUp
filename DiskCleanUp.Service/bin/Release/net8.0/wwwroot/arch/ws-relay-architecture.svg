<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">WebSocket Relay Architecture</title>
  <desc id="desc">VS Code and browser clients connect through an external WebSocket relay server. Workers run in the service host and stream events through the relay to the browser UI.</desc>

  <defs>
    <style>
      .label { font: 600 18px Segoe UI, Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 14px Segoe UI, Arial, sans-serif; fill: #374151; }
      .wire { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .back { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#arrow2); }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 10; }
      .accent { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 10; }
      .relay { fill: #ecfeff; stroke: #0891b2; stroke-width: 3; rx: 12; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1060" height="480" fill="#ffffff" stroke="#d1d5db" stroke-width="2" rx="14"/>

  <rect class="accent" x="60" y="120" width="260" height="120"/>
  <text class="label" x="190" y="165" text-anchor="middle">VS Code Extension</text>
  <text class="small" x="190" y="194" text-anchor="middle">start/stop scan control</text>
  <text class="small" x="190" y="216" text-anchor="middle">MCP + command orchestration</text>

  <rect class="relay" x="420" y="80" width="260" height="200"/>
  <text class="label" x="550" y="135" text-anchor="middle">External WebSocket Relay</text>
  <text class="small" x="550" y="164" text-anchor="middle">ws://host/ws</text>
  <text class="small" x="550" y="186" text-anchor="middle">fan-out + reconnect boundary</text>
  <text class="small" x="550" y="208" text-anchor="middle">single pipe for scan + metrics</text>

  <rect class="accent" x="780" y="120" width="260" height="120"/>
  <text class="label" x="910" y="165" text-anchor="middle">Browser UI Clients</text>
  <text class="small" x="910" y="194" text-anchor="middle">RAF queue drain + section handlers</text>
  <text class="small" x="910" y="216" text-anchor="middle">status bar + graphs + tables</text>

  <rect class="box" x="420" y="340" width="620" height="120"/>
  <text class="label" x="730" y="380" text-anchor="middle">DiskCleanUp Service Workers</text>
  <text class="small" x="730" y="406" text-anchor="middle">produce scan events + metrics, cache snapshots, and section updates</text>

  <line class="wire" x1="320" y1="180" x2="420" y2="180"/>
  <text class="small" x="370" y="170" text-anchor="middle">control + config</text>

  <line class="wire" x1="680" y1="180" x2="780" y2="180"/>
  <text class="small" x="730" y="170" text-anchor="middle">events + metrics</text>

  <line class="back" x1="780" y1="208" x2="680" y2="208"/>
  <text class="small" x="730" y="230" text-anchor="middle">start/stop + ack</text>

  <line class="wire" x1="550" y1="280" x2="550" y2="340"/>
  <text class="small" x="575" y="318">worker output stream</text>

  <line class="back" x1="520" y1="340" x2="520" y2="280"/>
  <text class="small" x="492" y="318" text-anchor="end">commands</text>
</svg>
