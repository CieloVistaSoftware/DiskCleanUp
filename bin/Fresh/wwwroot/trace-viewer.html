<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trace Viewer — DiskCleanUp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 16px; }
  h1 { font-size: 1.3rem; margin-bottom: 12px; color: #58a6ff; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar button {
    padding: 6px 14px; border: 1px solid #444; border-radius: 4px;
    background: #2a2a3e; color: #e0e0e0; cursor: pointer; font-size: .85rem;
  }
  .toolbar button:hover { background: #3a3a5e; }
  .toolbar button.active { background: #3a5a3e; border-color: #5a8a5e; }
  .toolbar .status { font-size: .8rem; color: #888; margin-left: auto; }
  #filter { padding: 6px 10px; border: 1px solid #444; border-radius: 4px; background: #2a2a3e; color: #e0e0e0; width: 200px; font-size: .85rem; }
  #log {
    background: #0d1117; border: 1px solid #333; border-radius: 6px;
    padding: 12px; font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: .8rem; line-height: 1.6; overflow-y: auto;
    max-height: calc(100vh - 120px); white-space: pre-wrap; word-break: break-all;
  }
  .line { padding: 1px 0; }
  .line:hover { background: #1c2333; }
  .tag-PAGE { color: #58a6ff; }
  .tag-INIT { color: #7ee787; }
  .tag-CACHE { color: #d2a8ff; }
  .tag-WS { color: #ffa657; }
  .tag-DUP { color: #ff7b72; }
  .tag-TRASH { color: #f778ba; }
  .tag-DEL { color: #f778ba; }
  .tag-STORE { color: #d2a8ff; }
  .tag-HB { color: #555; }
  .tag-FREEZE { color: #ff0000; font-weight: bold; background: #3d0000; padding: 2px 4px; border-radius: 3px; }
  .tag-FREEZE-TRAIL { color: #ff6666; background: #2d0000; padding: 2px 4px; border-radius: 3px; white-space: pre-wrap; }
  .tag-ERR { color: #ff4444; }
  /* Workflow breadcrumb tags — WF:module */
  .tag-WF\:init    { color: #7ee787; }
  .tag-WF\:ws      { color: #ffa657; }
  .tag-WF\:eq      { color: #b4a0ff; }
  .tag-WF\:sg      { color: #58a6ff; }
  .tag-WF\:page    { color: #d2a8ff; }
  .tag-WF\:handler { color: #ff7b72; }
  .tag-WF\:actions { color: #e3db60; }
  .tag-WF\:trash   { color: #f778ba; }
  .ms { color: #666; }
  .empty { color: #555; font-style: italic; padding: 40px; text-align: center; }
</style>
</head>
<body>
<h1>Trace Viewer</h1>
<div class="toolbar">
  <button onclick="loadTrace()" title="Refresh latest 200 entries">Refresh</button>
  <button onclick="loadAll()" id="loadAllBtn" title="Load entire trace file (may be slow)">Load All</button>
  <button onclick="copyTrace()" title="Copy visible entries to clipboard">Copy</button>
  <button onclick="clearTrace()" title="Delete all trace entries">Clear</button>
  <input type="text" id="filter" placeholder="Filter (e.g. FREEZE, WF:sg, WS)" oninput="applyFilter()">
  <label><input type="checkbox" id="autoRefresh" checked> Auto-refresh</label>
  <span class="status" id="status">Loading...</span>
</div>
<div id="log"><div class="empty">Loading trace...</div></div>

<script>
const PAGE_SIZE = 200;
let allLines = [];
let totalOnServer = 0;
let showingAll = false;
let refreshTimer = null;

function formatLine(line) {
  const m = line.match(/^(\+\d+ms)\s+\[([^\]]+)\]\s+(.*)$/);
  if (!m) return `<div class="line">${esc(line)}</div>`;
  const [, ms, tag, msg] = m;
  const cls = 'tag-' + tag.replace(/[^A-Za-z:\-]/g, '');
  return `<div class="line"><span class="ms">${esc(ms)}</span> <span class="${cls}">[${esc(tag)}]</span> ${esc(msg)}</div>`;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadTrace() {
  showingAll = false;
  document.getElementById('loadAllBtn').classList.remove('active');
  try {
    const r = await fetch(`/api/trace?tail=${PAGE_SIZE}`);
    const data = await r.json();
    allLines = data.lines || [];
    totalOnServer = data.total || allLines.length;
    applyFilter();
    const showing = allLines.length < totalOnServer
      ? `${allLines.length} of ${totalOnServer}`
      : `${allLines.length}`;
    document.getElementById('status').textContent = `${showing} entries — ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    document.getElementById('status').textContent = `Error: ${e.message}`;
  }
}

async function loadAll() {
  showingAll = true;
  document.getElementById('loadAllBtn').classList.add('active');
  // Pause auto-refresh while showing all (to avoid resetting to 200)
  document.getElementById('autoRefresh').checked = false;
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  try {
    document.getElementById('status').textContent = 'Loading all...';
    const r = await fetch('/api/trace');
    const data = await r.json();
    allLines = data.lines || [];
    totalOnServer = data.total || allLines.length;
    applyFilter();
    document.getElementById('status').textContent = `All ${allLines.length} entries — ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    document.getElementById('status').textContent = `Error: ${e.message}`;
  }
}

function applyFilter() {
  const filter = document.getElementById('filter').value.toLowerCase();
  const filtered = filter ? allLines.filter(l => l.toLowerCase().includes(filter)) : allLines;
  const el = document.getElementById('log');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty">No trace entries' + (filter ? ' matching filter' : '') + '</div>';
    return;
  }
  el.innerHTML = filtered.slice().reverse().map(formatLine).join('');
}

async function copyTrace() {
  const filter = document.getElementById('filter').value.toLowerCase();
  const lines = filter ? allLines.filter(l => l.toLowerCase().includes(filter)) : allLines;
  try {
    await navigator.clipboard.writeText(lines.join('\n'));
    document.getElementById('status').textContent = `Copied ${lines.length} lines`;
  } catch {
    document.getElementById('status').textContent = 'Copy failed';
  }
}

async function clearTrace() {
  await fetch('/api/trace', { method: 'DELETE' });
  allLines = [];
  totalOnServer = 0;
  applyFilter();
  document.getElementById('status').textContent = 'Cleared';
}

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    if (document.getElementById('autoRefresh').checked && !showingAll) loadTrace();
  }, 2000);
}

document.getElementById('autoRefresh').addEventListener('change', (e) => {
  if (e.target.checked) { showingAll = false; startAutoRefresh(); }
  else if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
});

loadTrace();
startAutoRefresh();
</script>
</body>
</html>
