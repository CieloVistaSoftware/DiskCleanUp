<svg viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#58a6ff"/></marker>
        <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#a371f7"/></marker>
        <marker id="a3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3fb950"/></marker>
        <marker id="a4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f85149"/></marker>
        <marker id="a5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#e3b341"/></marker>
      </defs>

      <!-- SYSMON KERNEL LAYER -->
      <rect x="10" y="10" width="1080" height="80" rx="8" fill="#0c0f14" stroke="#f85149" stroke-width="1" stroke-dasharray="6,3"/>
      <text x="550" y="35" text-anchor="middle" fill="#f85149" font-family="Outfit" font-size="11" font-weight="700">WINDOWS KERNEL - SYSMON ETW DRIVER</text>
      <text x="550" y="55" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="10">Event ID 11 (FileCreate) / 23 (FileDelete) / 26 (FileDeleteDetected) &gt; Event Log</text>
      <text x="550" y="72" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="10">Filtered to configured scan roots only / ~0.1% CPU overhead</text>

      <!-- SERVICE BOX -->
      <rect x="10" y="110" width="620" height="400" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="320" y="136" text-anchor="middle" fill="#58a6ff" font-family="Outfit" font-size="12" font-weight="700">DiskCleanUp.Service / Windows Service / localhost:5100</text>

      <!-- SysmonWatcher -->
      <rect x="30" y="152" width="200" height="60" rx="6" fill="#0c0f14" stroke="#f85149" stroke-width="1"/>
      <text x="130" y="172" text-anchor="middle" fill="#f85149" font-family="Outfit" font-size="10" font-weight="600">SysmonWatcher</text>
      <text x="130" y="188" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">EventLogWatcher subscription</text>
      <text x="130" y="201" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">5s debounce &gt; DeltaScan</text>

      <!-- ScanOrchestrator -->
      <rect x="250" y="152" width="200" height="60" rx="6" fill="#0c0f14" stroke="#e3b341" stroke-width="1"/>
      <text x="350" y="172" text-anchor="middle" fill="#e3b341" font-family="Outfit" font-size="10" font-weight="600">ScanOrchestrator</text>
      <text x="350" y="188" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">Channel&lt;ScanEvent&gt; per section</text>
      <text x="350" y="201" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">Parallel.ForEachAsync workers</text>

      <!-- BackgroundScanService -->
      <rect x="470" y="152" width="148" height="60" rx="6" fill="#0c0f14" stroke="#a371f7" stroke-width="1"/>
      <text x="544" y="172" text-anchor="middle" fill="#a371f7" font-family="Outfit" font-size="10" font-weight="600">Scheduled Scans</text>
      <text x="544" y="188" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">BackgroundScanService</text>
      <text x="544" y="201" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">Startup + Interval + Daily</text>

      <!-- Kestrel + WS -->
      <rect x="30" y="232" width="250" height="56" rx="6" fill="#0c0f14" stroke="#3fb950" stroke-width="1"/>
      <text x="155" y="252" text-anchor="middle" fill="#3fb950" font-family="Outfit" font-size="10" font-weight="600">Kestrel HTTP + WebSocket</text>
      <text x="155" y="268" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">REST API / WS /ws / Static files (wwwroot)</text>
      <text x="155" y="281" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">CORS: localhost only</text>

      <!-- ConfigService -->
      <rect x="300" y="232" width="148" height="56" rx="6" fill="#0c0f14" stroke="#58a6ff" stroke-width="1"/>
      <text x="374" y="252" text-anchor="middle" fill="#58a6ff" font-family="Outfit" font-size="10" font-weight="600">ConfigService</text>
      <text x="374" y="268" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">config.json / keep-list</text>
      <text x="374" y="281" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">savings / errors</text>

      <!-- MetricsService -->
      <rect x="468" y="232" width="148" height="56" rx="6" fill="#0c0f14" stroke="#7d8590" stroke-width="1"/>
      <text x="542" y="252" text-anchor="middle" fill="#7d8590" font-family="Outfit" font-size="10" font-weight="600">MetricsService</text>
      <text x="542" y="268" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">CPU / Memory / Threads</text>
      <text x="542" y="281" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">5s interval &gt; WS broadcast</text>

      <!-- JSONL Disk Storage -->
      <rect x="30" y="310" width="585" height="56" rx="6" fill="#0c0f14" stroke="#7d8590" stroke-width="1" stroke-dasharray="5,3"/>
      <text x="322" y="332" text-anchor="middle" fill="#7d8590" font-family="Outfit" font-size="10" font-weight="600">%ProgramData%\DiskCleanUp\</text>
      <text x="322" y="350" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">scan-cache/*.json (JSONL) / config.json / keep-list.json / sysmon-config.xml / savings.jsonl / logs/</text>

      <!-- API Endpoints -->
      <rect x="30" y="386" width="585" height="56" rx="6" fill="#0c0f14" stroke="#3fb950" stroke-width="1"/>
      <text x="322" y="406" text-anchor="middle" fill="#3fb950" font-family="Outfit" font-size="10" font-weight="600">REST API Endpoints</text>
      <text x="322" y="422" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">/api/cache / /api/config / /api/trash / /api/keep-list / /api/metrics / /api/scan / /api/sysmon</text>
      <text x="322" y="436" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">/api/debug / /api/trace / /api/errors / /api/file / /api/preview / /api/open*</text>

      <!-- Scan Workers -->
      <rect x="30" y="462" width="585" height="38" rx="6" fill="#0c0f14" stroke="#e3b341" stroke-width="1"/>
      <text x="322" y="486" text-anchor="middle" fill="#e3b341" font-family="Outfit" font-size="9" font-weight="600">SCAN WORKERS: duplicates / smart-dedup / stale / large / node-modules / venvs / empty / images / backups / tiny / html / css</text>

      <!-- TRAY APP BOX -->
      <rect x="660" y="110" width="200" height="200" rx="10" fill="#0d1117" stroke="#a371f7" stroke-width="1.5"/>
      <text x="760" y="136" text-anchor="middle" fill="#a371f7" font-family="Outfit" font-size="12" font-weight="700">DiskCleanUp.Tray</text>
      <text x="760" y="158" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="10">WinForms NotifyIcon</text>
      <text x="760" y="184" text-anchor="middle" fill="#7d8590" font-family="Outfit" font-size="10">Open Dashboard</text>
      <text x="760" y="202" text-anchor="middle" fill="#7d8590" font-family="Outfit" font-size="10">Start / Stop / Restart Service</text>
      <text x="760" y="220" text-anchor="middle" fill="#7d8590" font-family="Outfit" font-size="10">Green / Blue / Gray / Red icons</text>
      <text x="760" y="238" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">Health poll: GET /api/service/info</text>
      <text x="760" y="256" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">every 10s</text>

      <!-- BROWSER BOX -->
      <rect x="660" y="340" width="430" height="170" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <text x="875" y="366" text-anchor="middle" fill="#3fb950" font-family="Outfit" font-size="12" font-weight="700">Browser Dashboard / http://localhost:5100</text>
      <text x="875" y="392" text-anchor="middle" fill="#7d8590" font-family="Outfit" font-size="10">Existing wwwroot/ - HTML / JS / CSS</text>
      <text x="875" y="410" text-anchor="middle" fill="#7d8590" font-family="Outfit" font-size="10">WebSocket &gt; event-queue &gt; RAF &gt; scan-grid</text>
      <text x="875" y="428" text-anchor="middle" fill="#7d8590" font-family="Outfit" font-size="10">Batch fetch: /api/cache/{section}</text>
      <text x="875" y="456" text-anchor="middle" fill="#e3b341" font-family="Outfit" font-size="10" font-weight="600">Zero frontend code changes</text>
      <text x="875" y="472" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">Relative URLs work - same origin (service serves static + API)</text>
      <text x="875" y="490" text-anchor="middle" fill="#484f58" font-family="Outfit" font-size="9">Activity feed + heatmap + scan freshness (NEW)</text>

      <!-- ARROWS -->
      <line x1="130" y1="90" x2="130" y2="150" stroke="#f85149" stroke-width="1.5" marker-end="url(#a4)"/>
      <text x="140" y="122" fill="#f85149" font-family="Outfit" font-size="8">ETW events</text>
      <line x1="230" y1="182" x2="248" y2="182" stroke="#e3b341" stroke-width="1.5" marker-end="url(#a5)"/>
      <line x1="470" y1="182" x2="452" y2="182" stroke="#e3b341" stroke-width="1.5" marker-end="url(#a5)"/>
      <line x1="300" y1="212" x2="200" y2="232" stroke="#3fb950" stroke-width="1.5" marker-end="url(#a3)"/>
      <line x1="660" y1="200" x2="630" y2="260" stroke="#a371f7" stroke-width="1.5" marker-end="url(#a2)"/>
      <text x="654" y="240" text-anchor="end" fill="#a371f7" font-family="Outfit" font-size="8">HTTP health</text>
      <line x1="760" y1="310" x2="760" y2="338" stroke="#3fb950" stroke-width="1.5" marker-end="url(#a3)"/>
      <text x="775" y="328" fill="#3fb950" font-family="Outfit" font-size="8">launch</text>
      <line x1="280" y1="288" x2="658" y2="400" stroke="#3fb950" stroke-width="2" marker-end="url(#a3)"/>
      <text x="460" y="336" fill="#3fb950" font-family="Outfit" font-size="9" font-weight="600">WS signals + REST data</text>

      <!-- Legend -->
      <rect x="880" y="110" width="200" height="120" rx="6" fill="#0c0f14" stroke="#21262d" stroke-width="1"/>
      <text x="980" y="130" text-anchor="middle" fill="#7d8590" font-family="Outfit" font-size="10" font-weight="600">Legend</text>
      <line x1="895" y1="144" x2="925" y2="144" stroke="#f85149" stroke-width="1.5"/><text x="932" y="148" fill="#8b949e" font-family="Outfit" font-size="9">Sysmon kernel events</text>
      <line x1="895" y1="162" x2="925" y2="162" stroke="#e3b341" stroke-width="1.5"/><text x="932" y="166" fill="#8b949e" font-family="Outfit" font-size="9">Scan orchestration</text>
      <line x1="895" y1="180" x2="925" y2="180" stroke="#3fb950" stroke-width="1.5"/><text x="932" y="184" fill="#8b949e" font-family="Outfit" font-size="9">Data flow (WS + REST)</text>
      <line x1="895" y1="198" x2="925" y2="198" stroke="#a371f7" stroke-width="1.5"/><text x="932" y="202" fill="#8b949e" font-family="Outfit" font-size="9">Tray app control</text>
      <line x1="895" y1="216" x2="925" y2="216" stroke="#7d8590" stroke-width="1" stroke-dasharray="4,3"/><text x="932" y="220" fill="#8b949e" font-family="Outfit" font-size="9">Disk storage</text>
    </svg>
