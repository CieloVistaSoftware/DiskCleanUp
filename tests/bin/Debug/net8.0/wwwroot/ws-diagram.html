<!-- ═══════════════════════════════════════════════════════════════════════
     wwwroot/ws-diagram.html
     WebSocket connection architecture diagram. Documents the three failure
     modes (WS broken/HTTP alive, both down, reconnect loop) and the
     recovery flow. Dev reference — not linked from the main dashboard.
     ═══════════════════════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebSocket Connection Diagram — DiskCleanUp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; background: #0d1117; display: flex; flex-direction: column; align-items: center; }
  h1 { color: #e6edf3; font-family: 'Segoe UI', sans-serif; font-size: 1rem; padding: 14px 0 6px; opacity: .55; letter-spacing: .04em; }
  svg { width: 100%; max-width: 960px; height: auto; padding: 0 16px 32px; }
</style>
</head>
<body>
<h1>🔌 Dashboard WebSocket Architecture</h1>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 780" font-family="Segoe UI, sans-serif">
  <rect width="840" height="780" rx="12" fill="#0d1117"/>
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f85149"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#e3b341"/></marker>
  </defs>
  <text x="420" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">Dashboard Startup — WebSocket is the Critical Path</text>
  <text x="420" y="48" text-anchor="middle" fill="#8b949e" font-size="11">Nothing should happen until the WebSocket is connected</text>
  <rect x="30" y="65" width="240" height="28" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="150" y="84" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">BROWSER (Edge)</text>
  <rect x="300" y="65" width="240" height="28" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="1"/>
  <text x="420" y="84" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="700">WEBSOCKET</text>
  <rect x="570" y="65" width="240" height="28" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="690" y="84" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">SERVICE (:5100)</text>
  <line x1="150" y1="93" x2="150" y2="640" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,6" opacity="0.3"/>
  <line x1="420" y1="93" x2="420" y2="640" stroke="#e3b341" stroke-width="1" stroke-dasharray="4,6" opacity="0.3"/>
  <line x1="690" y1="93" x2="690" y2="640" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,6" opacity="0.3"/>
  <rect x="580" y="110" width="220" height="44" rx="8" fill="#0d2818" stroke="#3fb950" stroke-width="1.5"/>
  <text x="690" y="130" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">1. Service starts</text>
  <text x="690" y="144" text-anchor="middle" fill="#8b949e" font-size="9">Kestrel binds :5100 from dashboard_config.json</text>
  <rect x="30" y="170" width="240" height="44" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="150" y="190" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="700">2. User opens localhost:5100</text>
  <text x="150" y="204" text-anchor="middle" fill="#8b949e" font-size="9">HTTP GET index.html + JS + CSS</text>
  <line x1="270" y1="192" x2="578" y2="145" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)" stroke-dasharray="4,3"/>
  <text x="420" y="162" text-anchor="middle" fill="#58a6ff" font-size="9">HTTP 200 (static files)</text>
  <rect x="30" y="230" width="240" height="44" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="150" y="250" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="700">3. DOMContentLoaded</text>
  <text x="150" y="264" text-anchor="middle" fill="#8b949e" font-size="9">init.js calls wsConnect()</text>
  <line x1="150" y1="214" x2="150" y2="228" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="270" y1="250" x2="395" y2="295" stroke="#e3b341" stroke-width="2" marker-end="url(#ao)"/>
  <text x="310" y="280" fill="#e3b341" font-size="9" font-weight="600">new WebSocket("ws://localhost:5100/ws")</text>
  <rect x="310" y="296" width="220" height="52" rx="8" fill="#1a1a0d" stroke="#e3b341" stroke-width="2"/>
  <text x="420" y="316" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="700">4. WS HANDSHAKE</text>
  <text x="420" y="332" text-anchor="middle" fill="#8b949e" font-size="9">HTTP 101 Switching Protocols</text>
  <text x="420" y="342" text-anchor="middle" fill="#8b949e" font-size="9">Full-duplex channel established</text>
  <line x1="530" y1="315" x2="578" y2="315" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="580" y="296" width="220" height="52" rx="8" fill="#0d2818" stroke="#3fb950" stroke-width="1.5"/>
  <text x="690" y="316" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">WsManager.HandleAsync()</text>
  <text x="690" y="332" text-anchor="middle" fill="#8b949e" font-size="9">Accepts socket, adds to client list</text>
  <text x="690" y="342" text-anchor="middle" fill="#8b949e" font-size="9">Begins listening for messages</text>
  <line x1="310" y1="322" x2="270" y2="368" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="30" y="365" width="240" height="44" rx="8" fill="#0d2818" stroke="#3fb950" stroke-width="2"/>
  <text x="150" y="385" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">5. LIVE</text>
  <text x="150" y="399" text-anchor="middle" fill="#8b949e" font-size="9">onopen fires — status shows connected</text>
  <rect x="140" y="420" width="560" height="36" rx="6" fill="#0d2818" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="420" y="443" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">GATE: WebSocket connected — service may now begin work</text>
  <rect x="580" y="475" width="220" height="52" rx="8" fill="#0d2818" stroke="#3fb950" stroke-width="1.5"/>
  <text x="690" y="495" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">6. Scans begin</text>
  <text x="690" y="509" text-anchor="middle" fill="#8b949e" font-size="9">BackgroundScanService starts</text>
  <text x="690" y="519" text-anchor="middle" fill="#8b949e" font-size="9">ONLY because a client is connected</text>
  <line x1="690" y1="456" x2="690" y2="473" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="578" y1="490" x2="445" y2="490" stroke="#e3b341" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="510" y="484" text-anchor="middle" fill="#e3b341" font-size="8" font-weight="600">started / progress / batch-ready</text>
  <line x1="445" y1="505" x2="578" y2="505" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="510" y="518" text-anchor="middle" fill="#58a6ff" font-size="8" font-weight="600">start / cancel commands</text>
  <line x1="310" y1="490" x2="270" y2="490" stroke="#e3b341" stroke-width="1.5" marker-end="url(#ao)"/>
  <rect x="30" y="475" width="240" height="44" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="150" y="495" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="700">7. Dashboard renders results</text>
  <text x="150" y="509" text-anchor="middle" fill="#8b949e" font-size="9">Tables, progress bars, metrics</text>
  <line x1="30" y1="545" x2="810" y2="545" stroke="#f85149" stroke-width="1.5"/>
  <text x="420" y="565" text-anchor="middle" fill="#f85149" font-size="12" font-weight="700">FAILURE: What happens when WS cannot connect</text>
  <rect x="30" y="580" width="240" height="52" rx="8" fill="#2a0d0d" stroke="#f85149" stroke-width="2"/>
  <text x="150" y="600" text-anchor="middle" fill="#f85149" font-size="11" font-weight="700">Browser on wrong port</text>
  <text x="150" y="614" text-anchor="middle" fill="#8b949e" font-size="9">wsConnect() — Connection Refused</text>
  <text x="150" y="626" text-anchor="middle" fill="#f85149" font-size="10" font-weight="700">Connecting... (15s timeout, then error)</text>
  <line x1="270" y1="606" x2="308" y2="606" stroke="#f85149" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="310" y="580" width="220" height="52" rx="8" fill="#2a0d0d" stroke="#f85149" stroke-width="2"/>
  <text x="420" y="600" text-anchor="middle" fill="#f85149" font-size="11" font-weight="700">No WS connection</text>
  <text x="420" y="614" text-anchor="middle" fill="#8b949e" font-size="9">Service not running or wrong port</text>
  <text x="420" y="626" text-anchor="middle" fill="#f85149" font-size="9" font-weight="600">Gate never opens — nothing works</text>
  <rect x="580" y="580" width="220" height="52" rx="8" fill="#0d2818" stroke="#3fb950" stroke-width="1.5"/>
  <text x="690" y="600" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">Service :5100 alive</text>
  <text x="690" y="614" text-anchor="middle" fill="#8b949e" font-size="9">But browser is not connected to it</text>
  <text x="690" y="626" text-anchor="middle" fill="#8b949e" font-size="9">No client — idle</text>
  <rect x="120" y="655" width="600" height="44" rx="8" fill="#0d2818" stroke="#3fb950" stroke-width="2"/>
  <text x="420" y="675" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">Fix: Use tray Start — kills port, starts service, opens browser</text>
  <text x="420" y="691" text-anchor="middle" fill="#8b949e" font-size="10">Port comes from dashboard_config.json — one source of truth</text>
  <rect x="30" y="720" width="780" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <line x1="50" y1="742" x2="80" y2="742" stroke="#3fb950" stroke-width="2"/>
  <text x="85" y="746" fill="#8b949e" font-size="9">Happy path</text>
  <line x1="170" y1="742" x2="200" y2="742" stroke="#e3b341" stroke-width="2"/>
  <text x="205" y="746" fill="#8b949e" font-size="9">WebSocket channel</text>
  <line x1="310" y1="742" x2="340" y2="742" stroke="#58a6ff" stroke-width="2"/>
  <text x="345" y="746" fill="#8b949e" font-size="9">Browser actions</text>
  <line x1="440" y1="742" x2="470" y2="742" stroke="#f85149" stroke-width="2"/>
  <text x="475" y="746" fill="#8b949e" font-size="9">Failure path</text>
  <rect x="570" y="735" width="100" height="16" rx="4" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="680" y="746" fill="#8b949e" font-size="9">Gate (WS required)</text>
</svg>
</body>
</html>
